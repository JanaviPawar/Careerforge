# =============================================
# SERVER
# =============================================
server.port=8080
spring.application.name=CareerForge

# =============================================
# MYSQL DATABASE
# =============================================
# Adjust username/password to match what you
# created in MySQL during Step 2 setup.
spring.datasource.url=jdbc:mysql://localhost:3306/careerforge_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=careerforge_user
spring.datasource.password=Janavi.p@2204
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.baseline-on-migrate=true
# =============================================
# JPA / HIBERNATE
# =============================================
# "update" = Hibernate auto-creates/updates tables from your @Entity classes.
# Use this during development. Switch to "validate" in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =============================================
# REDIS
# =============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
# 600000 ms = 10 minutes default TTL

# =============================================
# JWT
# =============================================
# Must be at least 32 characters for HS256.
# In production, use a randomly generated string.
jwt.secret=CareerForge_SuperSecret_JWT_Key_2025_Min32Chars!
jwt.expiration=86400000
# 86400000 ms = 24 hours

# =============================================
# AWS S3
# =============================================
aws.s3.bucket-name=careerforge-resumes
aws.s3.region=ap-south-1
aws.access-key=YOUR_AWS_ACCESS_KEY
aws.secret-key=YOUR_AWS_SECRET_KEY

# =============================================
# FILE UPLOAD LIMITS
# =============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# LOGGING
# =============================================
logging.level.com.careerforge=DEBUG
logging.level.org.springframework.security=INFO